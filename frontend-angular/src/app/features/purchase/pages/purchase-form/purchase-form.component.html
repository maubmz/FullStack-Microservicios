<form (ngSubmit)="savePurchase()">
  <label for="idClient">Id del cliente: </label>
  <input type="number" id="idClient" [(ngModel)]="purchase.idClient" name="idClient"/>
  <br>

  <label for="purchases">Productos: </label>
  <div class="product-list">
    @for (product of products; track product.id) {
      <div class="product-item">
        <input
          type="checkbox"
          [id]="product.id"
          [value]="product.name"
          (change)="onCheckboxChange($event, product)"
          [checked]="isProductSelected(product.id)"
        />
        <label [for]="product.id">
          {{ product.id }} - {{ product.name }} - Stock: {{ product.stock }}
        </label>
      </div>
    }
  </div>
  <br>

  <button type="submit">Guardar</button>
  <button type="button" routerLink="/purchases">Regresar</button>

</form>
