<button routerLink="/purchases/new">Crear una nueva compra</button>
<table class="entity-table">
  <thead>
    <tr>
      @for (header of listHeaders; track header) {
        <th>{{ header }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for(purchase of purchases; track purchase.idPurchase) {
      <tr>
        <td>{{ purchase.idPurchase }}</td>
        <td>{{ purchase.clientName }}</td>
        <td>
          @for (product of purchase.products; track $index) {
            <div>{{ product.name }}</div>
          }
        </td>
        <td>{{ purchase.quantity }}</td>
        <td>
          <button class="editBtn" [routerLink]="['/purchases/edit', purchase.idPurchase]">Editar</button>
        </td>
        <td>
          <button class="delBtn" type="button" (click)="deletePurchase(purchase)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
