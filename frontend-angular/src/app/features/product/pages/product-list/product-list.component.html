<table class="entity-table">
  <thead>
    <tr>
      @for (header of listHeaders; track header ) {
        <th>{{ header }}</th>
      }
    </tr>
  </thead>

  <tbody>
    @for (product of products; track product.id) {
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <button [routerLink]="['/products/edit', product.id]">Editar</button>
        </td>
      </tr>
    }

  </tbody>

</table>
