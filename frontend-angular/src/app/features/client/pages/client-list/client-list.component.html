<button routerLink="/clients/new">Crear un nuevo cliente</button>
<table class="entity-table">
  <thead>
    <tr>
      @for (header of listHeaders; track header) {
      <th>{{ header }}</th>
    }
    </tr>
  </thead>

  <tbody>
    @for (client of clients; track client.idClient) {
      <tr>
        <td>{{ client.idClient }}</td>
        <td>{{ client.name }}</td>
        <td>{{ client.email }}</td>
        <td>{{ client.phone }}</td>
        <td>{{ client.purchases.length }}</td>
        <td>
          <button class="editBtn" [routerLink]="['/clients/edit', client.idClient]">Editar</button>
        </td>
        <td>
          <button class="delBtn" type="button" (click)="deleteClient(client)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
