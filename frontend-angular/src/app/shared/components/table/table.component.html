<h1 class="page-title">{{ title() }}</h1>
<table class="app-table">
    <thead>
        <tr>
            @for(column of columns(); track column.label) {
                <th>{{ column.label }}</th>
            }
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let row of data">
            @for(column of columns(); track column.label) {
                <td>{{ getCellValue(row, column) }}</td>
            }
        </tr>
    </tbody>

</table>
<a class="back-link" routerLink="">Return Home</a>
